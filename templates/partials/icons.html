{% macro icon(name) -%}
<svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{% if name == 'reports' %}<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 17v-3m4 3v-6m4 6v-4" />
{% elif name == 'emission' %}<rect x="3" y="3" width="18" height="18" rx="3" /><circle cx="8" cy="8" r="1.5" /><path d="m3 17 5-5 4 4 4-6 5 7" />
{% elif name == 'sectors' %}<rect x="3" y="3" width="7" height="7" rx="1" /><rect x="14" y="3" width="7" height="7" rx="1" /><rect x="3" y="14" width="7" height="7" rx="1" /><rect x="14" y="14" width="7" height="7" rx="1" />
{% elif name == 'history' %}<path d="M3 11a9 9 0 1 1 2.5 7M3 5v6h6M12 7v5l3 2" />
{% elif name == 'users' %}<circle cx="9" cy="8" r="3" /><path d="M3 21v-2a6 6 0 0 1 12 0v2m2-16a3 3 0 0 1 0 6m2 4a5 5 0 0 1 2 4v2" />
{% elif name == 'user' %}<circle cx="12" cy="7" r="4" /><path d="M4 21v-2a8 8 0 0 1 16 0v2" />
{% elif name == 'user-add' %}<circle cx="9" cy="7" r="4" /><path d="M2 21v-2a7 7 0 0 1 14 0v2m3-13v6m-3-3h6" />
{% elif name == 'logout' %}<path d="M9 4H4v16h5m5-12 4 4-4 4m-6-4h13" />
{% elif name == 'dashboard' %}<path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15m6-12v15" />
{% elif name == 'sacarose' %}<path d="M20 4C9 2 3 8 5 16s16 4 15-12ZM4 21 16 9" />
{% elif name == 'returns' %}<path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4" />
{% elif name == 'calendar' %}<rect x="3" y="5" width="18" height="16" rx="2" /><path d="M7 3v4m10-4v4M3 11h18m-14 5h2m6 0h2" />
{% elif name == 'clock' %}<circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" />{% endif %}
</svg>
{%- endmacro %}
